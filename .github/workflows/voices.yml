name: Generate voices
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  voices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generate ElevenLabs narration
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID || 'wg2c4NFlL6Xu2OtIfObu' }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
        run: python3 tool/generate_voices.py
      - name: Save the new clips to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/voice
          git diff --cached --quiet || git commit -m "Add ElevenLabs narration"
          git push
  build:
    needs: voices
    uses: ./.github/workflows/build-apk.yml
