name: Build APK
on:
  workflow_dispatch:
  workflow_call:
  push:
    paths-ignore: [tool/voices.trigger]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - name: Complete Android scaffolding (keeps existing files)
        run: flutter create --org com.daftari --project-name daftari --platforms android .
      - name: Use the fixed signing key (so updates install over the previous version)
        run: mkdir -p ~/.android && cp android/keystore/debug.keystore ~/.android/debug.keystore
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: {name: Daftari-APK, path: build/app/outputs/flutter-apk/app-release.apk}
      - name: Publish a download link for students (latest release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          cp build/app/outputs/flutter-apk/app-release.apk daftari.apk
          gh release delete "v$VERSION" -y --cleanup-tag || true
          gh release create "v$VERSION" daftari.apk --latest \
            --title "دفتر المذاكرة $VERSION" \
            --notes "تطبيق دفتر المذاكرة — تم تصميم هذا البرنامج بواسطة الأستاذ محمد سعود المطيري. للتثبيت: نزّل daftari.apk وافتحه على جوال أندرويد."
