name: daftari
description: "Daftari • دفتر المذاكرة"
publish_to: 'none'
version: 0.3.0+5

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  audioplayers: 6.8.1
  flutter_tts: 4.2.5
  shared_preferences: 2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/images/
    - assets/audio/
    - assets/audio/voice/
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
